[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway"
version = "0.1.0"
description = "PII-redacting OpenAI-compatible proxy in front of Headroom"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Paulo Perez"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "presidio-analyzer>=2.2.355,<3.0",
  "presidio-anonymizer>=2.2.355,<3.0",
  "pydantic>=2.8,<3.0",
]
keywords = ["privacy", "proxy", "headroom", "redaction", "hermes"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0",
]

[project.urls]
Repository = "https://github.com/C0deRhin0/privacy-gateway"
Issues = "https://github.com/C0deRhin0/privacy-gateway/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
